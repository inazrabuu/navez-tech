baseURL: https://navez.tech/
locale: en-US
defaultContentLanguage: en
title: navez.tech
enableGitInfo: true
enableRobotsTXT: false # we ship static/robots.txt
timeZone: Asia/Jakarta
summaryLength: 30

# English is the main language at the site root; Indonesian lives under /id/.
# Translations are files named <name>.id.md (or index.id.md in bundles) next to the English file.
# Legal pages (privacy, terms, security) are English-only for now; Indonesian pages link to them.
languages:
  en:
    label: English
    locale: en-US
    weight: 1
  id:
    label: Bahasa Indonesia
    locale: id-ID
    weight: 2
    title: navez.tech
    params:
      description: "Mitra teknologi B2B di Indonesia: website yang mendatangkan pelanggan, ERP yang menjalankan operasional, AI agent yang mengotomatiskan pekerjaan, dan keamanan untuk semuanya."
    # Indonesian section URLs (keyword-led). Page slugs come from `slug:` in each .id.md file.
    permalinks:
      page:
        services: /layanan/:slug/
        use-cases: /solusi/:slug/
        work: /studi-kasus/:slug/
        insights: /artikel/:slug/
        glossary: /artikel/glosarium/:slug/
        authors: /penulis/:slug/
      section:
        services: /layanan/
        use-cases: /solusi/
        work: /studi-kasus/
        insights: /artikel/
        glossary: /artikel/glosarium/
        authors: /penulis/
      taxonomy:
        category: /artikel/kategori/
      term:
        category: /artikel/kategori/:slug/

module:
  hugoVersion:
    min: "0.170.0"
  mounts:
    - source: assets
      target: assets
    - source: hugo_stats.json
      target: assets/notwatching/hugo_stats.json
      disableWatch: true

build:
  buildStats:
    enable: true
  cachebusters:
    - source: assets/notwatching/hugo_stats\.json
      target: css
    - source: (postcss|tailwind)\.config\.js
      target: css

taxonomies:
  category: category

permalinks:
  page:
    insights: /insights/:slug/
    glossary: /insights/glossary/:contentbasename/
  section:
    glossary: /insights/glossary/
  taxonomy:
    category: /insights/category/
  term:
    category: /insights/category/:slug/

outputFormats:
  llms:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true
    permalinkable: true

outputs:
  home: [html, rss, llms]
  section: [html, rss]
  taxonomy: [html]
  term: [html]

services:
  rss:
    limit: 20

markup:
  goldmark:
    renderer:
      unsafe: false
    parser:
      attribute:
        block: true
  tableOfContents:
    startLevel: 2
    endLevel: 3

imaging:
  resampleFilter: Lanczos
  jpeg:
    quality: 80
  webp:
    quality: 80

sitemap:
  changeFreq: weekly
  priority: 0.5

minify:
  tdewolff:
    html:
      keepWhitespace: false

params:
  description: "B2B technology partner in Indonesia: websites that win customers, ERP that runs operations, AI agents that automate work, and security for all of it."
  ogImage: images/brand/og-default.png
  logo: images/brand/logo-512.png
  # Sections listed in /llms.txt and the sitemap-style overview
  mainSections: [insights]
  # Main navigation (labels come from i18n keys)
  # `page` is a content path; templates resolve it to the current language's URL.
  nav:
    - key: nav_use_cases
      page: /use-cases
    - key: nav_work
      page: /work
    - key: nav_insights
      page: /insights
    - key: nav_about
      page: /about
  # Share-image text colours (hex needed by Hugo's image filters; mirror the @theme tokens in main.css).
  og:
    title_color: "#ffffff"
    label_color: "#5b86ff" # brand-soft
    muted_color: "#aab4c8"
  social:
    linkedin: https://www.linkedin.com/company/navez-tech/

security:
  exec:
    allow: ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$', '^npx$']
