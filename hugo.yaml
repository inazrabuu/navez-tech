baseURL: https://navez.tech/
locale: en-US
defaultContentLanguage: en
title: navez.tech
enableGitInfo: true
enableRobotsTXT: false # we ship static/robots.txt
timeZone: Asia/Jakarta
summaryLength: 30

# English only at launch. Adding Indonesian later = add an `id` block here,
# i18n/id.yaml, and `id` to the Sveltia i18n locales.
languages:
  en:
    label: English
    weight: 1

module:
  hugoVersion:
    min: "0.170.0"
  mounts:
    - source: assets
      target: assets
    - source: hugo_stats.json
      target: assets/notwatching/hugo_stats.json
      disableWatch: true

build:
  buildStats:
    enable: true
  cachebusters:
    - source: assets/notwatching/hugo_stats\.json
      target: css
    - source: (postcss|tailwind)\.config\.js
      target: css

taxonomies:
  category: category

permalinks:
  page:
    insights: /insights/:slug/
    glossary: /insights/glossary/:contentbasename/
  section:
    glossary: /insights/glossary/
  taxonomy:
    category: /insights/category/
  term:
    category: /insights/category/:slug/

outputFormats:
  llms:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true
    permalinkable: true

outputs:
  home: [html, rss, llms]
  section: [html, rss]
  taxonomy: [html]
  term: [html]

services:
  rss:
    limit: 20

markup:
  goldmark:
    renderer:
      unsafe: false
    parser:
      attribute:
        block: true
  tableOfContents:
    startLevel: 2
    endLevel: 3

imaging:
  resampleFilter: Lanczos
  jpeg:
    quality: 80
  webp:
    quality: 80

sitemap:
  changeFreq: weekly
  priority: 0.5

minify:
  tdewolff:
    html:
      keepWhitespace: false

params:
  description: "B2B technology partner in Indonesia: websites that win customers, ERP that runs operations, AI agents that automate work, and security for all of it."
  ogImage: images/brand/og-default.png
  logo: images/brand/logo-512.png
  # Sections listed in /llms.txt and the sitemap-style overview
  mainSections: [insights]
  # Main navigation (labels come from i18n keys)
  nav:
    - key: nav_use_cases
      url: /use-cases/
    - key: nav_work
      url: /work/
    - key: nav_insights
      url: /insights/
    - key: nav_about
      url: /about/
  social:
    # TODO(content): confirm real profile URLs
    linkedin: https://www.linkedin.com/company/navez-tech/

security:
  exec:
    allow: ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$', '^npx$']
