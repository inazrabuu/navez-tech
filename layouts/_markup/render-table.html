{{- /* Markdown tables scroll horizontally on small screens. */ -}}
<div class="overflow-x-auto" role="region" tabindex="0" aria-label="{{ i18n "table" }}">
  <table{{ range $k, $v := .Attributes }} {{ $k }}="{{ $v }}"{{ end }}>
    <thead>
      {{- range .THead }}
      <tr>{{ range . }}<th{{ with .Alignment }} class="text-{{ . }}"{{ end }}>{{ .Text }}</th>{{ end }}</tr>
      {{- end }}
    </thead>
    <tbody>
      {{- range .TBody }}
      <tr>{{ range . }}<td{{ with .Alignment }} class="text-{{ . }}"{{ end }}>{{ .Text }}</td>{{ end }}</tr>
      {{- end }}
    </tbody>
  </table>
</div>
