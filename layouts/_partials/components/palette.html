{{- /*
  Command palette (Ctrl/⌘K). Native <dialog>; Alpine component "palette" in main.js
  queries the Pagefind index. Quick links are shown when the query is empty.
  Context: Page (unused).
*/ -}}
<dialog id="palette" class="mx-auto mt-[10vh] w-[min(40rem,calc(100vw-2rem))] max-w-none rounded-card bg-white p-0 text-ink shadow-[0_30px_60px_-30px_rgb(10_22_48/0.5)]" aria-label="{{ i18n "search" }}" x-data="palette" @close="reset()" data-pagefind-ignore="all">
  <div class="flex items-center gap-3 border-b border-line px-4">
    {{ partial "components/icon.html" (dict "name" "search" "class" "size-5 text-ink-soft") }}
    <label for="palette-input" class="sr-only">{{ i18n "search_label" }}</label>
    <input id="palette-input" type="search" autocomplete="off" spellcheck="false" placeholder="{{ i18n "search_placeholder" }}"
      class="h-14 flex-1 bg-transparent text-base text-ink placeholder:text-ink-soft focus:outline-none"
      role="combobox" aria-expanded="true" aria-controls="palette-results" :aria-activedescendant="active >= 0 ? 'palette-opt-' + active : null"
      x-model="query" @input.debounce.150ms="search()" @keydown.down.prevent="move(1)" @keydown.up.prevent="move(-1)" @keydown.enter.prevent="go()">
    <button type="button" class="rounded-[0.3rem] border border-line px-1.5 py-0.5 text-xs text-ink-soft hover:text-ink" @click="$root.close()">Esc</button>
  </div>

  <div class="max-h-[60vh] overflow-y-auto p-2">
    <template x-if="!query">
      <div>
        <p class="px-3 pt-2 pb-1 text-xs font-semibold text-ink-soft">{{ i18n "search_quick_links" }}</p>
        <ul class="grid gap-0.5">
          {{- range (site.GetPage "/services").Pages.ByWeight }}
          <li><a href="{{ .RelPermalink }}" class="flex min-h-11 items-center gap-3 rounded-control px-3 hover:bg-surface">{{ partial "components/icon.html" (dict "name" .Params.icon "class" "size-5 text-brand") }}{{ .Title }}</a></li>
          {{- end }}
          <li><a href="{{ "/book-a-call/" | relURL }}" class="flex min-h-11 items-center gap-3 rounded-control px-3 hover:bg-surface">{{ partial "components/icon.html" (dict "name" "calendar" "class" "size-5 text-brand") }}{{ i18n "cta_book_call" }}</a></li>
          <li><a href="{{ "/insights/" | relURL }}" class="flex min-h-11 items-center gap-3 rounded-control px-3 hover:bg-surface">{{ partial "components/icon.html" (dict "name" "file" "class" "size-5 text-brand") }}{{ i18n "nav_insights" }}</a></li>
        </ul>
      </div>
    </template>

    <ul id="palette-results" role="listbox" aria-label="{{ i18n "search_results" }}" class="grid gap-0.5" x-show="query">
      <template x-for="(r, i) in results" :key="r.url">
        <li role="option" :id="'palette-opt-' + i" :aria-selected="i === active">
          <a :href="r.url" class="block rounded-control px-3 py-2.5 hover:bg-surface" :class="i === active && 'bg-surface'" @mouseenter="active = i">
            <span class="block font-semibold text-ink" x-text="r.title"></span>
            <span class="mt-0.5 line-clamp-2 block text-sm text-ink-soft" x-html="r.excerpt"></span>
          </a>
        </li>
      </template>
    </ul>
    <p class="px-3 py-6 text-center text-sm text-ink-soft" x-show="query && !loading && message" x-text="message" aria-live="polite"></p>
  </div>
</dialog>
